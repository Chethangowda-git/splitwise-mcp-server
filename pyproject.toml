[project]
name = "splitwise-mcp-server"
version = "0.1.0"
description = "MCP server that reconciles receipts and splits them fairly, to the exact cent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
splitwise-mcp-server = "splitwise_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splitwise_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
